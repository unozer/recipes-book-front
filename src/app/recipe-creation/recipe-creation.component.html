@if (valueChanges$ | async) {}
@if (saveClick$ | async) {}
@if (uploadRecipeImages$ | async) {}

<h1>New Recipe</h1>
<form [formGroup]="recipeForm">

    <div class="row">
        <div class="col-4">
            <label for="title">Title</label>
            <input placeholder="..." type="text" name="Title" formControlName="title">
        </div>

        <div class="col-4">
            <label for="Ingredients">Ingredients</label>
            <input placeholder="..." type="text" name="Ingredients" formControlName="ingredients">
        </div>
        <div class="col-1">
            <i class="pi pi-plus" style="padding-top:20px; font-size: 1rem"></i>
        </div>

        <div class="col-3">
            <label for="Tags">Tags</label>
            <!-- @for (tag of tags; track tags) {
            <p-radioButton [inputId]="tag.key" [value]="tag" formControlName="tags"></p-radioButton>
            <label class="recipe-tag" [for]="tag.key">{{tag.name}}</label>
            } -->
            @if (tagValues$ | async; as tags) {
            <p-autoComplete formControlName="tags" [suggestions]="tags"
                (completeMethod)="updateSearchTerm($event.query)" field="name"></p-autoComplete>
            }
        </div>
    </div>


    <div class="row">
        <div class="col-12">
            <label for="ImageUrl">ImageUrl</label>
            <p-fileUpload name="imageUrl" 
            [multiple]=true 
            [customUpload]="true" 
            accept="image/*"
            (uploadHandler)="onUpload($event.files)"></p-fileUpload>
        </div>

        <div class="col-3">
            <label for="cookingTime">CookingTime</label>
            <input placeholder="..." type="text" name="cookingTime" formControlName="cookingTime">
        </div>
    </div>


    <div class="row">
        <div class="col-4">
            <label for="yield">Yield</label>
            <input placeholder="..." type="text" name="yield" formControlName="yield">
        </div>

        <div class="col-3">
            <label for="prepTime">Preparation Time</label>
            <input placeholder="..." type="text" name="prepTime" formControlName="prepTime">
        </div>
    </div>


    <div class="row">

        <div class="col-12">
            <label for="steps">Steps</label>
            <textarea placeholder="..." name="steps" formControlName="steps"></textarea>
        </div>
    </div>


</form>

<div class="right-actions-panel">
    <p-button class="recipe-button" label="Cancel"></p-button>
    <p-button class="recipe-button" (click)="updateRecipe()" label="Save"></p-button>
</div>
