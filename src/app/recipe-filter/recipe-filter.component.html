<div class="rp-data-view">
    <form [formGroup]="recipeForm">
        <fieldset class="rp-filters-group">
            <legend>Filters</legend>
            <div class="rp-filter-button">
                <p-button (onClick)="clearFilters()" label="Clear all"></p-button>
            </div>
            <label for="title">Keyword:</label>
            <input type="text" id="title" formControlName="title">
            <label for="category">Category:</label>
            <input type="text" id="category" formControlName="category">
            <label for="ingredient">Ingredient:</label>
            <input type="text" id="ingredient" formControlName="ingredients">
            <label for="text">Tags:</label>
            <input type="text" id="tags" formControlName="tags" placeholder="TAG">
            <label for="text">Preparation Time:</label>
            <input type="text" id="prepTime" formControlName="prepTime" placeholder="0h 0m">
            <label for="text">Cooking Time:</label>
            <input type="text" id="cookingTime" formControlName="cookingTime" placeholder="0h 0m">
            <div class="rp-filter-button">
                <p-button class="rp-filter-button" (onClick)="filterResults()" label="See results">
                </p-button>
            </div>
        </fieldset>
    </form>
</div>
